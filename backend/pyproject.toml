[project]
name = "tpv-backend"
version = "0.1.0"
description = "TPV Moderno — backend (fase 03: autenticación y permisos)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

# Build explícito para `pip install .` (imagen Docker de fase Despliegue):
# sin esto, el auto-discovery de setuptools ve «app» y «alembic» y se niega.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
